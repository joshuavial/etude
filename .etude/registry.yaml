# Explicit reviewer identities. Worker selection is host-managed; see docs/development.md.
# env_allowlist here applies ONLY to review seats, not arbitrary checks/stages.
quorum: unanimous
seats:
  fable:
    provider: anthropic/claude-fable-5-1
    harness: claude-code
    env_allowlist: [CLAUDE_CONFIG_DIR, CLAUDE_CODE_OAUTH_TOKEN, USER]
    invoke: 'scripts/seat-adapter.sh fable claude -p --model claude-fable-5-1 --effort high --no-session-persistence --tools='
  astra:
    provider: openai/gpt-6-astra
    harness: codex
    env_allowlist: [CODEX_HOME]
    invoke: 'scripts/seat-adapter.sh astra codex exec --ephemeral -m gpt-6-astra -c model_reasoning_effort=high -s read-only -'
  sol:
    provider: openai/gpt-5.6-sol
    harness: codex
    env_allowlist: [CODEX_HOME]
    invoke: 'scripts/seat-adapter.sh sol codex exec --ephemeral -m gpt-5.6-sol -c model_reasoning_effort=high -s read-only -'
  sonnet:
    provider: anthropic/claude-sonnet-5
    harness: claude-code
    env_allowlist: [CLAUDE_CONFIG_DIR, CLAUDE_CODE_OAUTH_TOKEN, USER]
    invoke: 'scripts/seat-adapter.sh sonnet claude -p --model claude-sonnet-5 --effort high --no-session-persistence --tools='
tiers:
  L2:
    name: Consequential independent review
    seats: [astra, fable]
  L3:
    name: Routine review for dev-claude
    seats: [sol]
  L4:
    name: Routine review for dev-codex
    seats: [sonnet]
