# Etude seat/tier registry — the single machine-readable source of truth for
# named runners and tier presets. Two consumers read this file:
#   - the LIVE RUN ENGINE: resolves stage runners and gate seat invocations by
#     name from this registry.
#   - the REVIEW SKILL (etude-review): reads seat invoke/mode here and per-phase
#     tier + abstraction from the matching stage gate block in workflow.yaml.
#
# A seat is a MODEL/HARNESS identity that reviews the SAME shared prompt and
# votes GO/BLOCK. Seats are NEVER role personas (that is design-council, a
# different tool); divergence comes from model diversity, not assigned roles.
# Every tier requires a UNANIMOUS pass of its seats — none advances on partial
# approval. A seat failure (auth/quota/tool/empty/truncation) never counts as a
# pass and escalates per the degraded-gate policy in the runbook.

quorum: unanimous

# Seat identities + canonical non-interactive invocations. Each seat receives
# ONLY the shared gate prompt and the inlined artifact — never hidden context.
# `mode` captures the hard-won per-seat execution constraint (see the runbook
# "Per-seat execution constraints"): seats MUST NOT mutate the working tree.
seats:
  opus:
    provider: anthropic/claude-opus
    harness: claude-code
    # `claude -p` returns 401 when the ORCHESTRATOR is itself Claude Code: the
    # host session's credentials are not exposed to a subprocess. The primary
    # invoke below is correct only when a NON-Claude harness (e.g. codex)
    # orchestrates the gate.
    #
    # The adapter turns the CLI's prose RETURN block into the JSON envelope etude
    # reads from $ETUDE_OUTPUT_FILE. A bare CLI writes nothing there and would be
    # classified `empty`, so a subprocess invoke MUST name the adapter.
    invoke: "scripts/seat-adapter.sh opus claude -p --model opus"
    mode: inline
    # Ordered fallbacks, tried when the primary invocation cannot run. The
    # candidate that actually ran is recorded in the gate's session/provider
    # evidence.
    #
    # The first entry is NOT a shell command, and that is deliberate. When the
    # orchestrator is Claude Code it cannot authenticate a `claude` subprocess,
    # but it CAN spawn an in-harness Task sub-agent — a fresh, separately
    # authenticated opus identity given only the shared gate prompt and the
    # inlined artifact. That is a REAL seat producing a REAL verdict, not a
    # degraded substitute, and its record needs no degraded_reason.
    #
    # This used to live only in a prose comment, which meant a worker could read
    # it, believe it, and stop. It is config now so a consumer can act on it:
    # `in-harness:` marks a candidate the HOST must run itself rather than exec.
    invocation_fallbacks:
      - harness: claude-code-subagent
        invoke: "in-harness:task subagent_type=general-purpose model=opus"
        mode: inline
  codex:
    provider: openai/gpt-5.5
    harness: codex
    invoke: 'scripts/seat-adapter.sh codex codex exec --ephemeral -m gpt-5.5 -c model_reasoning_effort=xhigh -s read-only -'
    model_fallbacks: [gpt-5.4, gpt-5.3, gpt-5.2]
    mode: diff-only
  # The gemini seat was REMOVED 2026-08-16. The gemini CLI fails before review
  # with "IneligibleTierError: this client is no longer supported for Gemini Code
  # Assist for individuals", and Google's own migration path is the Antigravity
  # suite (the agy CLI), which is deliberately not used here.
  dev:
    provider: anthropic/claude-opus
    harness: claude-code
    invoke: "claude -p --model opus"

# Tier numbers are inverted by weight: L1 is the heaviest, L4 the lightest.
tiers:
  # NOTE: with the gemini seat removed this panel is identical to L2 and L3, so
  # escalating to L1 currently buys no extra model diversity. The tier is kept so
  # existing per-stage declarations and escalation paths keep resolving; restoring
  # a genuine third seat or collapsing the tier is tracked separately.
  L1:
    name: Heaviest gate
    seats: [opus, codex]
    use: >-
      Heaviest; reserve for the riskiest L1 surfaces or when escalating: storage
      format / ref-namespace / git-plumbing changes that could lose or corrupt
      data, or break backward compatibility.
  L2:
    name: Strong two-seat gate
    seats: [opus, codex]
    use: >-
      The heavy-QA panel. Default for the PLAN and VERIFY phase gates and for any
      change touching product/CLI behavior, schema/format, refs/etude/*, or docs
      claiming NEW shipped behavior.
  L3:
    name: Medium two-seat gate
    seats: [opus, codex]
    use: >-
      The IMPLEMENT-phase gate, and low-risk localized refactors / validation
      tightening / test strengthening on an already-gated component.
  L4:
    name: Light single-seat gate
    seats: [opus]
    use: >-
      DOCS and FINAL REVIEW phase gates, and changes with no shipping-code change
      (test-only additions or docs/planning-only changes).
