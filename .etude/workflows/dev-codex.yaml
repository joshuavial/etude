# External workers produce artifacts; supervisor captures and gates them.
# No autonomous stage runner is configured. See docs/development.md.
name: dev-codex
env_allowlist: [HOME]
stages:
  - name: plan
    produces: plan
    inputs: [task]
    skill: dev-planner
    gate:
      tier: L2
      pass_threshold: 1
      max_rounds: 3
      abstraction: "High-risk plan only: requirements, contracts, feasibility and failure modes. Implementation details are optional unless they make the design infeasible."
  - name: implement
    produces: diff
    inputs: [plan, repo-state]
    skill: dev-executor
  - name: verify
    produces: verify
    inputs: [plan, diff]
    skill: dev-qa
  - name: docs
    produces: docs-diff
    inputs: [diff]
    skill: dev-docs-writer
  - name: review
    produces: review
    inputs: [plan, diff, verify, docs-diff]
    skill: dev-pr-reviewer
    gate:
      tier: L2
      pass_threshold: 1
      max_rounds: 3
      abstraction: "Consequential final review: actual code, technical docs, acceptance criteria and independent QA evidence. Block on concrete defects with trigger and consequence."
  - name: routine-review
    produces: routine-review
    inputs: [plan, diff, verify, docs-diff]
    skill: dev-pr-reviewer
    optional: true
    gate:
      tier: L4
      pass_threshold: 1
      max_rounds: 3
      abstraction: "Routine final review: code, docs and verification evidence satisfy acceptance criteria. Optional improvements are not blockers."
